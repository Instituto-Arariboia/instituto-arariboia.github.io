---
layout: default
---
<main class="page-shell post-page">
  <article class="container post-article">
    <header class="post-header">
      <p class="eyebrow red">{{ page.category | default: 'Publicação' }}</p>
      <h1>{{ page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%d/%m/%Y" }}</p>
      {% if page.summary %}
      <p class="post-summary">{{ page.summary }}</p>
      {% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <a class="text-link post-back" href="{{ '/publicacoes/' | relative_url }}">Voltar para publicações</a>
  </article>
</main>
